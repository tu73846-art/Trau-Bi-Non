plugins { id 'com.android.application' }

android {
    namespace 'com.traubinon.app'
    compileSdk 35
    ndkVersion '26.3.11579264'
    defaultConfig {
        applicationId 'com.traubinon.app'
        minSdk 22
        targetSdk 28
        versionCode 2
        versionName '1.1'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DANDROID_ARM_NEON=ON',
                    "-DSDL2_SRC=${rootProject.file('SDL2').absolutePath}"
            }
        }
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
