<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#03090e"><title>Trâu Bi Non</title>
<style>
:root{--c:#19dcff;--bg:#03090e;--panel:#0a1821;--muted:#7896a5}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#d9f8ff;font-family:Arial,sans-serif}body{display:flex;flex-direction:column;padding:7px;gap:6px}button,input{font:inherit}button{background:#102631;color:#c9f8ff;border:1px solid #168eaa;border-radius:8px;padding:7px 10px;font-weight:700;min-height:32px}button:active,.active{background:#07506a;border-color:var(--c);box-shadow:0 0 9px #00d9ff88}header{height:38px;flex:none;border:1px solid var(--c);border-radius:10px;display:flex;align-items:center;justify-content:space-between;padding:4px 8px;color:var(--c);font-weight:bold;box-shadow:0 0 9px #00cfff33}header button{min-height:28px;padding:4px 10px}main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:8px}.tile{height:min(62%,28vw);aspect-ratio:1;border:1px solid #17677c;border-radius:12px;background:linear-gradient(145deg,#0d202b,#071018);display:flex;align-items:center;justify-content:center;text-align:center;color:#89aebb;padding:5px;overflow:hidden;word-break:break-word}.tile.big{height:min(88%,37vw);aspect-ratio:1.12;border:2px solid var(--c);color:#e2fbff;box-shadow:0 0 14px #00cfff44;font-weight:bold;font-size:clamp(12px,2.8vw,20px);flex:none}.tile small{display:block;color:var(--muted);font-size:10px;margin-top:5px}.actions{display:flex;justify-content:center;gap:6px;flex:none}.actions button{font-size:clamp(9px,2vw,13px)}footer{height:39px;flex:none;display:flex;align-items:center;justify-content:space-around;border:1px solid #165a70;border-radius:9px;padding:2px;gap:4px}footer button{flex:1;height:31px;padding:0;font-size:15px}footer button:nth-child(3){flex:1.5;color:#fff;border-color:#a5eaff}#hint{height:0.8cm;min-height:24px;max-height:28px;flex:none;text-align:center;color:#75b6c8;font-size:10px;display:flex;align-items:center;justify-content:center;border-top:1px solid #17485a}#menu{display:none;position:absolute;right:8px;top:48px;width:min(210px,58vw);padding:7px;background:#07131c;border:1px solid var(--c);border-radius:10px;z-index:5;box-shadow:0 0 15px #00cfff55}#menu button{display:block;width:100%;margin:4px 0;text-align:left}#panel{display:none;position:absolute;inset:8% 5%;background:#07131c;border:1px solid var(--c);border-radius:12px;padding:10px;overflow:auto;z-index:8;box-shadow:0 0 20px #00cfff55}#panel h3{margin:4px 0 10px;color:var(--c)}#panel input{width:100%;background:#02090e;color:white;border:1px solid #168eaa;border-radius:7px;padding:8px;margin:4px 0}#panel .close{float:right}#panel button{margin:3px}#gameList{max-height:32vh;overflow:auto}.gameRow{display:flex;gap:5px;align-items:center;padding:5px;border-bottom:1px solid #163b49}.gameRow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.muted{color:var(--muted);font-size:10px}.slotgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.slot{min-height:45px}#searchbar{display:none;position:absolute;left:8%;right:8%;top:48px;z-index:6;background:#07131c;border:1px solid var(--c);padding:8px;border-radius:10px}#searchbar input{width:100%;padding:9px;background:#02090e;color:white;border:1px solid var(--c);border-radius:8px}#searchResults{max-height:30vh;overflow:auto;margin-top:5px}#searchResults button{display:block;width:100%;text-align:left;margin:3px 0;min-height:30px}#notice{color:#9fd8e8;font-size:11px;margin:6px 0}.keys{display:flex;gap:5px;flex-wrap:wrap}.keys button{flex:1;min-width:35px}.red{border-color:#ff6682}.yellow{border-color:#f6d45c}.green{border-color:#63e6a3}.blue{border-color:#68aaff}

/* Compact touch layout for small Android screens (including 3.5-inch displays). */
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;touch-action:pan-y}button{touch-action:manipulation;user-select:none;-webkit-user-select:none}#menu,#panel{overscroll-behavior:contain}#panel{padding:8px}#panel button{min-height:34px}#panel input,#panel select{min-height:36px;font-size:14px}#gameList{max-height:28vh}.gameRow{min-height:40px}
@media(max-width:520px){body{padding:5px;gap:4px}header{height:34px;padding:3px 6px}header button{min-height:27px;padding:3px 8px;font-size:12px}main{gap:5px}.tile{height:min(58%,27vw);min-width:0;padding:3px;font-size:10px}.tile.big{height:min(82%,35vw);font-size:clamp(11px,3vw,15px)}.tile small{font-size:9px}.actions{gap:4px}.actions button{min-height:30px;padding:4px 6px;font-size:10px}footer{height:35px;gap:3px}footer button{height:29px;min-height:29px;font-size:14px}#hint{height:0.8cm;min-height:23px;max-height:27px;font-size:9px}#menu{top:42px;right:5px;width:min(220px,72vw);max-height:75vh;overflow:auto}#searchbar{top:42px;left:5%;right:5%}#panel{inset:5% 3%;max-height:90%;}#panel h3{font-size:15px}#panel .muted{font-size:10px}}
@media(max-height:380px){body{padding:3px;gap:3px}header{height:30px}main{min-height:0}.tile{height:min(55%,24vw)}.tile.big{height:min(78%,32vw)}.actions button{min-height:27px}footer{height:31px}footer button{height:26px;min-height:26px}#hint{height:24px;min-height:24px}#panel{inset:3% 4%;padding:6px}}
</style></head><body>
<header><span>🐃 TRÂU BI NON</span><span><button onclick="toggleSearch()">⌕ TÌM</button> <button onclick="toggleMenu()">⋮</button></span></header>
<div id="searchbar"><input id="searchInput" placeholder="Nhập tên game để tìm..." oninput="renderGames()"><div id="searchResults"></div><button onclick="toggleSearch()">ĐÓNG</button></div>
<div id="menu"><button onclick="pickRom()">＋ Thêm game / ROM</button><button onclick="openPanel('library')">▤ Thư viện game</button><button onclick="openPanel('controls')">⌖ Cài nút điều khiển</button><button onclick="openPanel('graphics')">◈ Đồ họa & FPS</button><button onclick="openPanel('saves')">▣ Ô lưu game</button><button onclick="openPanel('cheats')">⚡ AutoCheat · Kho mã</button><button onclick="openPanel('network')">⇄ Chơi Online / Offline</button><button onclick="openBackupPanel()">▣ Sao lưu / Khôi phục</button><button onclick="openMyBoy()">▶ Mở My Boy!</button></div>
<main><div class="tile" id="prev" onclick="shift(-1)">TRƯỚC</div><div class="tile big" id="current">CHƯA CÓ GAME<small>Thêm ROM để bắt đầu</small></div><div class="tile" id="next" onclick="shift(1)">TIẾP</div></main>
<div class="actions"><button onclick="pickRom()">＋ THÊM GAME</button><button onclick="launchCurrent()">▶ CHẠY GAME</button><button onclick="openMyBoy()">MY BOY!</button></div>
<footer><button class="blue" onclick="virtualKey('UP')">↑</button><button class="blue" onclick="virtualKey('LEFT')">←</button><button onclick="saveSlot()">SL · OK</button><button class="blue" onclick="virtualKey('RIGHT')">→</button><button class="blue" onclick="virtualKey('DOWN')">↓</button></footer>
<div id="hint">A · B · X · Y · SL · ST  |  Vuốt trái / phải để đổi game</div>
<div id="panel"><button class="close" onclick="closePanel()">ĐÓNG ✕</button><div id="panelBody"></div></div>
<input id="cheatImport" type="file" accept=".txt,.cht,.json" style="display:none" onchange="importCheatFile(this.files[0])">
<input id="backupImport" type="file" accept=".json,application/json" style="display:none" onchange="importBackupFile(this.files[0])">
<script>
const $=id=>document.getElementById(id);
function safeLoad(key,fallback){try{const value=JSON.parse(localStorage.getItem(key));return value===null?fallback:value}catch(e){return fallback}}
function saveLocal(key,value){try{localStorage.setItem(key,typeof value==='string'?value:JSON.stringify(value));return true}catch(e){$('hint').textContent='Bộ nhớ ứng dụng đã đầy hoặc không thể ghi dữ liệu. Hãy giải phóng dung lượng rồi thử lại.';return false}}
let games=safeLoad('games',[]),index=0,cheats=safeLoad('cheats',{});
if(!Array.isArray(games))games=[];
const seenGameUris=new Set();
games=games.filter(g=>{
 if(!g||typeof g.name!=='string'||typeof g.uri!=='string'||!g.uri.trim())return false;
 const uri=g.uri.trim();if(seenGameUris.has(uri))return false;seenGameUris.add(uri);
 g.name=g.name.trim().slice(0,180);g.uri=uri;return !!g.name;
});
if(!cheats||typeof cheats!=='object'||Array.isArray(cheats))cheats={};
Object.keys(cheats).forEach(k=>{
 if(!Array.isArray(cheats[k])){delete cheats[k];return}
 cheats[k]=cheats[k].map((entry,i)=>normalizeCheatEntry(entry,i)).filter(entry=>entry&&validCheatCode(entry.code));
});
function persist(){return saveLocal('games',games)}
function toggleMenu(){ $('menu').style.display=$('menu').style.display==='block'?'none':'block'}
function toggleSearch(){ $('searchbar').style.display=$('searchbar').style.display==='block'?'none':'block';if($('searchbar').style.display==='block')$('searchInput').focus();else{$('searchInput').value='';renderGames()}}
function pickRom(){ $('menu').style.display='none';if(window.AndroidBridge)AndroidBridge.pickRom();else alert('Chọn ROM cần chạy trên bản Android.')}
function addGameFromAndroid(name,uri){name=String(name||'').trim().slice(0,180);uri=String(uri||'').trim();if(!name||!uri){$('hint').textContent='Không thể thêm ROM: tên hoặc đường dẫn không hợp lệ.';return}let found=games.findIndex(g=>g.uri===uri);if(found>=0){index=found;$('hint').textContent='ROM này đã có trong thư viện.';renderGames();return}games.push({name,uri});index=games.length-1;if(!persist()){games.pop();index=Math.max(0,Math.min(index,games.length-1));renderGames();return}renderGames();$('hint').textContent='Đã thêm: '+name+' · Nhấn CHẠY GAME'}
function renderGames(){let q=$('searchInput')?.value?.toLowerCase()||'';let filtered=games.filter(g=>g.name.toLowerCase().includes(q));let g=games[index];$('current').innerHTML=g?escapeHtml(g.name)+'<small>'+ (index+1)+' / '+games.length+' GAME</small>':'CHƯA CÓ GAME<small>Thêm ROM để bắt đầu</small>';let p=games[(index-1+games.length)%games.length],n=games[(index+1)%games.length];$('prev').textContent=p?p.name:'TRƯỚC';$('next').textContent=n?n.name:'TIẾP';let list=$('gameList');if(list)list.innerHTML=filtered.map(x=>'<div class="gameRow"><span>'+escapeHtml(x.name)+'</span><button onclick="selectGameByUri(\\''+encodeURIComponent(x.uri)+'\\')">CHỌN</button><button class="red" onclick="removeGameByUri(\\''+encodeURIComponent(x.uri)+'\\')">XÓA</button></div>').join('')||'<p class="muted">Chưa có game phù hợp.</p>';let results=$('searchResults');if(results)results.innerHTML=q?filtered.map(x=>'<button onclick="selectGameByUri(\\''+encodeURIComponent(x.uri)+'\\')">'+escapeHtml(x.name)+'</button>').join('')||'<p class="muted">Không tìm thấy game phù hợp.</p>':''}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function selectGameByUri(u){let uri=decodeURIComponent(u);index=games.findIndex(g=>g.uri===uri);closePanel();if($('searchbar').style.display==='block')toggleSearch();renderGames();$('hint').textContent='Đã chọn: '+(games[index]?.name||'game')}
function removeGameByUri(u){
 let uri=decodeURIComponent(u),at=games.findIndex(g=>g.uri===uri);
 if(at<0)return;
 let name=games[at].name;
 if(!confirm('Xóa '+name+' khỏi thư viện Trâu Bi Non? Tệp ROM gốc và save-state trong ứng dụng không bị xóa.'))return;
 const oldGames=games.slice(),oldCheats=JSON.parse(JSON.stringify(cheats));
 games.splice(at,1);
 const key=Object.keys(cheats).find(k=>k.trim().toLowerCase()===name.trim().toLowerCase());
 if(key)delete cheats[key];
 if(index>=games.length)index=Math.max(0,games.length-1);
 if((key&&!saveLocal('cheats',cheats))||!saveLocal('games',games)){games=oldGames;cheats=oldCheats;index=Math.min(at,games.length-1);if(key)saveLocal('cheats',oldCheats);saveLocal('games',oldGames);renderGames();renderCheatList();return}
 renderGames();renderCheatList();
 $('hint').textContent='Đã xóa '+name+' khỏi thư viện.';
}
function shift(d){if(!games.length)return;index=(index+d+games.length)%games.length;renderGames()}
function launchCurrent(){let g=games[index];if(!g){pickRom();return}let p=safeLoad('graphics',{});let quality=p.quality||'Tiêu chuẩn',fps=p.fps||'60 FPS';if(window.AndroidBridge)AndroidBridge.openRom(g.uri,quality,fps);else alert('Chỉ chạy ROM trong ứng dụng Android.')}
function openMyBoy(){ $('menu').style.display='none';if(window.AndroidBridge)AndroidBridge.openMyBoy();else alert('Chỉ có trên Android.')}
function launchMyBoyCurrent(){let g=games[index];if(!g){$('hint').textContent='Hãy thêm và chọn ROM trước';return}if(window.AndroidBridge&&AndroidBridge.openRomInMyBoy){AndroidBridge.openRomInMyBoy(g.uri);$('hint').textContent='Đang mở '+g.name+' trong My Boy!'}else{$('hint').textContent='Cần cài My Boy! để mở ROM trực tiếp'}}
function launchOnline(){let g=games[index];if(!g){$('hint').textContent='Hãy thêm và chọn ROM trước khi kết nối';closePanel();pickRom();return}$('hint').textContent='Đang mở '+g.name+' trong My Boy! · Thiết lập Link Cable trên My Boy!';closePanel();launchMyBoyCurrent()}
function openPanel(which){$('menu').style.display='none';let b=$('panelBody');$('panel').style.display='block';
if(which==='library'){b.innerHTML='<h3>THƯ VIỆN GAME</h3><button onclick="pickRom()">＋ THÊM ROM</button><div id="gameList"></div><p class="muted">Danh sách lưu trên thiết bị này.</p>'}
if(which==='controls'){b.innerHTML='<h3>CÀI NÚT ĐIỀU KHIỂN</h3><div class="keys"><button class="green">A</button><button class="red">B</button><button class="yellow">X</button><button class="blue">Y</button><button>SL</button><button>ST</button></div><p class="muted">Bố cục nút đang là giao diện điều khiển. Tín hiệu phím chưa được truyền vào lõi My Boy.</p>'}
if(which==='graphics'){b.innerHTML='<h3>ĐỒ HỌA & FPS</h3><label>Chế độ hiển thị</label><select id="quality"><option>Tiêu chuẩn</option><option>Lọc hình ảnh (mGBA)</option></select><p><label>FPS mục tiêu</label><select id="fps"><option>30 FPS</option><option>60 FPS</option></select></p><p class="muted">FPS mục tiêu và lọc hình ảnh được gửi trực tiếp tới lõi mGBA khi khởi chạy game tiếp theo.</p><button onclick="savePrefs()">LƯU CÀI ĐẶT</button>';let p=safeLoad('graphics',{});if(!p||typeof p!=='object')p={};$('quality').value=['Tiêu chuẩn','Lọc hình ảnh (mGBA)'].includes(p.quality)?p.quality:'Tiêu chuẩn';$('fps').value=['30 FPS','60 FPS'].includes(p.fps)?p.fps:'60 FPS'}
if(which==='saves'){b.innerHTML='<h3>Ô LƯU TRẠNG THÁI GAME</h3><p class="muted">Hỗ trợ tối đa 9999 ô save-state thật của lõi mGBA (giới hạn bởi dung lượng bộ nhớ). Khi đang chơi, chạm SLOT để chuyển ô 1–9999, SAVE để lưu và LOAD để khôi phục. Mỗi game có tệp lưu riêng trong bộ nhớ ứng dụng.</p><button onclick="closePanel();launchCurrent()">▶ MỞ GAME ĐỂ LƯU / TẢI</button><p class="muted">Không gỡ dữ liệu ứng dụng nếu muốn giữ các ô lưu. Nên sao lưu tiến trình quan trọng.</p>'}
if(which==='network'){let active=games[index]?.name||'';b.innerHTML='<h3>⇄ CHƠI ONLINE / OFFLINE</h3><p><b>OFFLINE · Một người chơi</b></p><p class="muted">Chạy game đã chọn trên điện thoại này, không cần mạng.</p><button onclick="closePanel();launchCurrent()">▶ CHẠY OFFLINE · mGBA</button><button onclick="closePanel();launchMyBoyCurrent()">▶ CHẠY OFFLINE · MY BOY!</button><hr style="border-color:#17485a"><p><b>ONLINE · Kết nối hai điện thoại</b></p><p class="muted">My Boy! hỗ trợ Link Remote qua Wi-Fi hoặc Bluetooth. Đây là chơi mạng cục bộ (LAN/hotspot), không phải máy chủ Internet.</p><p class="muted"><b>1.</b> Cả hai máy cài My Boy! và có ROM phù hợp. Với hai bản game khác nhau, cần có đủ cả hai ROM trên cả hai máy.</p><p class="muted"><b>2. Wi-Fi:</b> Kết nối hai máy cùng Wi-Fi hoặc bật điểm phát sóng ở một máy. Trong My Boy!, máy chủ chọn Menu → Link Remote → Wi-Fi Server; máy còn lại chọn Wi-Fi Client và nhập IP/port máy chủ hiển thị.</p><p class="muted"><b>3. Bluetooth:</b> Ghép đôi hai máy trong cài đặt Bluetooth trước, sau đó trong My Boy! một máy chọn Bluetooth Server, máy kia chọn Bluetooth Client.</p><p class="muted"><b>4.</b> Khi đã kết nối, vào khu vực Link/Cable trong game để giao dịch hoặc đấu nếu game hỗ trợ.</p><button onclick="launchOnline()">▶ MỞ ROM TRONG MY BOY!</button><p class="muted">Trâu Bi Non có thể mở ROM, nhưng My Boy! không cung cấp API công khai để ứng dụng này tự bật Server/Client hoặc tự ghép nối. Hãy hoàn tất các bước Link Remote trong My Boy!.</p>'}
if(which==='cheats'){let active=games[index]?.name||'';b.innerHTML='<h3>⚡ AUTOCHEAT · '+(active?escapeHtml(active):'KHO MÃ')+'</h3><p class="muted">Game đang chọn: '+(active?escapeHtml(active):'Chưa chọn game')+'</p><input id="cheatGame" placeholder="Tên game" value="'+escapeHtml(active)+'"><input id="cheatName" placeholder="Tên cheat"><input id="cheatCode" placeholder="Mã cheat"><button onclick="addCheat()">＋ LƯU CHEAT</button><button onclick="document.getElementById('cheatImport').click()">NHẬP TỆP .TXT / .CHT</button><button onclick="exportCheats()">XUẤT JSON</button><button onclick="exportCheatCht()">XUẤT .CHT</button><button onclick="searchCheatsOnline()">TÌM CHEAT TRÊN MẠNG</button><button onclick="copyAllCurrentCheats()">SAO CHÉP MÃ GAME NÀY</button><button onclick="applyCheatsAndLaunch()">LƯU CHEAT VÀ CHẠY mGBA</button><button onclick="openMyBoyWithCheats()">MỞ MY BOY!</button><div id="cheatList"></div><div id="onlineCheatResults"></div><p class="muted">Kho mã trực tuyến: Libretro Database (CC-BY-SA-4.0). Mã tải về sẽ mặc định TẮT để bạn chọn trước khi áp dụng. Hãy kiểm tra đúng phiên bản game/khu vực.</p>'}
renderGames();renderCheatList();updateSlots()}
function closePanel(){$('panel').style.display='none'}
function normalizeCheatEntry(x,i){
 if(typeof x==='string')return {name:'Cheat '+(i+1),code:x,enabled:true};
 if(!x||typeof x!=='object')return null;
 const code=String(x.code||x.codes||x.value||'').replace(/\\r/g,'').trim();
 if(!code)return null;
 return {name:String(x.name||x.title||('Cheat '+(i+1))).slice(0,100),code,enabled:x.enabled!==false};
}
function validCheatCode(code){
 const lines=String(code||'').split(/\\r?\\n/).map(x=>x.trim()).filter(Boolean);
 return lines.length>0&&lines.every(x=>/^(?:[0-9a-f]{8})\\s+(?:[0-9a-f]{4,8})$/i.test(x));
}
function addCheat(){
 let g=$('cheatGame').value.trim()||games[index]?.name||'Game chưa đặt tên';
 let n=$('cheatName').value.trim()||'Cheat',code=$('cheatCode').value.trim();
 if(!validCheatCode(code)){$('hint').textContent='Mã chưa đúng định dạng: mỗi dòng cần 8 ký tự hex, dấu cách, rồi 4–8 ký tự hex.';$('cheatCode').focus();return}
 const previous=Array.isArray(cheats[g])?cheats[g].slice():[];
 if(previous.some(x=>String(x.code).trim().toLowerCase()===code.toLowerCase())){$('hint').textContent='Mã này đã có trong kho của game.';return}
 cheats[g]=previous.concat([{name:n,code,enabled:true}]);
 if(!saveLocal('cheats',cheats)){if(previous.length)cheats[g]=previous;else delete cheats[g];return}
 $('cheatCode').value='';$('hint').textContent='Đã lưu mã cho '+g;renderCheatList();
}
function importCheatFile(file){
 if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  const raw=String(reader.result||''),game=$('cheatGame')?.value.trim()||games[index]?.name||'Game chưa đặt tên';
  const previousCheats=JSON.parse(JSON.stringify(cheats));
  let imported=[],jsonMode=/\\.json$/i.test(file.name);
  if(jsonMode){
   try{
    const obj=JSON.parse(raw);
    if(!obj||typeof obj!=='object')throw new Error('JSON không phải đối tượng');
    Object.keys(obj).forEach(k=>{
     const list=Array.isArray(obj[k])?obj[k]:[obj[k]];
     const normalized=list.map(normalizeCheatEntry).filter(x=>x&&validCheatCode(x.code));
     if(normalized.length)cheats[k]=[...(cheats[k]||[]),...normalized];
    });
   }catch(e){$('hint').textContent='Tệp JSON không hợp lệ hoặc sai cấu trúc.';return}
  }else{
   let name='',codes=[];
   const flush=()=>{if(codes.length)imported.push({name:name||('Cheat '+(imported.length+1)),code:codes.join('\\n'),enabled:true});codes=[]};
   for(const line of raw.split(/\\r?\\n/)){
    const t=line.trim();
    if(!t)continue;
    const heading=t.match(/^(?:\\[([^\\]]+)\\]|#\\s*(.+)|(?:Name|Cheat)\\s*[:=]\\s*(.+))$/i);
    if(heading){flush();name=(heading[1]||heading[2]||heading[3]||'').trim();continue}
    const numbered=t.match(/^\\d+[.)]\\s*(.+?)\\s*[-–]\\s*(?:GameShark(?:\\s*\\/\\s*Action Replay)?|Action Replay|CodeBreaker)\\s*$/i);
    if(numbered){flush();name=numbered[1].trim();continue}
    if(/^[0-9a-f]{8}\\s+[0-9a-f]{4,8}$/i.test(t)){codes.push(t);continue}
    if(/^(?:;|\\*|\\/\\/)/.test(t))continue;
   }
   flush();
   imported=imported.map((x,i)=>normalizeCheatEntry(x,i)).filter(x=>x&&validCheatCode(x.code));
   if(!imported.length){$('hint').textContent='Không tìm thấy mã hợp lệ trong tệp. Mỗi dòng mã cần dạng 8 ký tự hex + dấu cách + 4–8 ký tự hex.';return}
   cheats[game]=[...(cheats[game]||[]),...imported];
  }
  Object.keys(cheats).forEach(k=>{
   const seen=new Set();
   cheats[k]=(Array.isArray(cheats[k])?cheats[k]:[]).map(normalizeCheatEntry).filter(x=>{
    if(!x||!validCheatCode(x.code))return false;
    const key=x.code.toLowerCase();if(seen.has(key))return false;seen.add(key);return true;
   });
  });
  const importedCount=Object.keys(cheats).reduce((n,k)=>n+(cheats[k]||[]).length,0)-Object.keys(previousCheats).reduce((n,k)=>n+(previousCheats[k]||[]).length,0);
  if(importedCount<=0){cheats=previousCheats;$('hint').textContent='Tệp không có mã mới hợp lệ hoặc tất cả mã đã tồn tại.';$('cheatImport').value='';return}
  if(!saveLocal('cheats',cheats)){cheats=previousCheats;return}
  $('hint').textContent='Đã nhập '+importedCount+' mã AutoCheat hợp lệ.';$('cheatImport').value='';renderCheatList();
 };
 reader.onerror=()=>{$('hint').textContent='Không đọc được tệp cheat.'};
 reader.readAsText(file);
}
function currentCheatEntries(){let name=games[index]?.name||$('cheatGame')?.value||'';let key=Object.keys(cheats).find(k=>k.trim().toLowerCase()===name.trim().toLowerCase());return key?cheats[key]:[]}
function renderCheatList(){let e=$('cheatList');if(!e)return;let entries=currentCheatEntries();e.innerHTML=entries.map((x,i)=>'<div class="gameRow"><span><b>'+escapeHtml(x.name)+'</b> · '+(x.enabled===false?'TẮT':'BẬT')+'<br>'+escapeHtml(x.code)+'</span><button onclick="toggleCheat('+i+')">'+(x.enabled===false?'BẬT':'TẮT')+'</button><button onclick="copyOneCheat('+i+')">CHÉP</button></div>').join('')||'<p class="muted">Chưa có mã cho game này. Hãy thêm mã ở trên.</p>'}
function toggleCheat(i){let game=games[index]?.name||$('cheatGame')?.value||'';let key=Object.keys(cheats).find(k=>k.trim().toLowerCase()===game.trim().toLowerCase());if(!key||!cheats[key][i])return;let previous=cheats[key][i].enabled;cheats[key][i].enabled=previous===false;if(!saveLocal('cheats',cheats)){cheats[key][i].enabled=previous;return}renderCheatList()}
function applyCheatsAndLaunch(){let g=games[index];if(!g){$('hint').textContent='Hãy thêm và chọn ROM trước';return}let entries=currentCheatEntries();if(!entries.length){$('hint').textContent='Chưa có mã cheat cho game này';return}let body=entries.map(x=>{let lines=String(x.code||'').split(/\r?\n/).map(v=>v.trim()).filter(Boolean);if(!lines.length)return '';let name=String(x.name||'Cheat').replace(/[\r\n]/g,' ');return (x.enabled===false?'!disabled\n':'')+'# '+name+'\n'+lines.join('\n')}).filter(Boolean).join('\n');if(!window.AndroidBridge||!AndroidBridge.saveCheats){$('hint').textContent='Cần bản Android mới để áp dụng AutoCheat vào mGBA';return}AndroidBridge.saveCheats(g.name,body);$('hint').textContent='Đã ghi kho cheat cho '+g.name+' · đang mở game';closePanel();launchCurrent()}

function openMyBoyWithCheats(){let xs=currentCheatEntries();if(!xs.length){$('hint').textContent='Chưa có mã cho game đang chọn';return}copyCheatText(xs.map(x=>x.name+'\n'+x.code).join('\n\n'));launchMyBoyCurrent()}

function exportCheatCht(){let game=games[index]?.name||$('cheatGame')?.value||'game';let entries=currentCheatEntries();if(!entries.length){$('hint').textContent='Chưa có mã để xuất';return}let body=entries.map(x=>'['+String(x.name||'Cheat').replace(/[\\r\\n\\[\\]]/g,' ')+']\\n'+(x.enabled===false?'!disabled\\n':'')+x.code).join('\\n\\n');let blob=new Blob([body],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=game.replace(/[^A-Za-z0-9._-]/g,'_')+'.cht';a.click();URL.revokeObjectURL(a.href);$('hint').textContent='Đã xuất .CHT. Có thể nhập thủ công vào ứng dụng hỗ trợ định dạng này.'}
function normalizeCheatTitle(value){
 return String(value||'').replace(/\\.(gba|gbc|gb)$/i,'').replace(/\\([^)]*\\)|\\[[^\\]]*\\]/g,' ').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().replace(/\\s+/g,' ');
}
async function searchCheatsOnline(){
 const game=games[index]?.name||$('cheatGame')?.value||'';
 if(!game.trim()){$('hint').textContent='Chọn game trước khi tìm mã';return}
 const target=normalizeCheatTitle(game);
 $('hint').textContent='Đang tìm kho mã GBA trực tuyến…';
 const box=$('onlineCheatResults');if(box)box.innerHTML='<p class="muted">Đang kết nối Libretro Database…</p>';
 try{
  const endpoint='https://api.github.com/repos/libretro/libretro-database/contents/cht/Nintendo%20-%20Game%20Boy%20Advance?per_page=1000';
  const response=await fetch(endpoint,{headers:{'Accept':'application/vnd.github+json'}});
  if(!response.ok)throw new Error('Kho mã trả về HTTP '+response.status);
  const files=await response.json();
  const tokens=target.split(' ').filter(x=>x.length>1&&!['the','and','for','gba','game'].includes(x));
  const matches=files.filter(f=>f.type==='file'&&/\\.cht$/i.test(f.name)).map(f=>{
   const title=normalizeCheatTitle(f.name);
   const words=new Set(title.split(' ').filter(x=>x.length>1));
   const overlap=tokens.filter(x=>words.has(x)).length;
   const score=tokens.length?overlap/tokens.length:0;
   const exact=title===target||title.startsWith(target+' ');
   return {file:f,score:exact?2:score};
  }).filter(x=>x.score>=0.5).sort((a,b)=>b.score-a.score||a.file.name.localeCompare(b.file.name)).slice(0,12);
  if(!box)return;
  if(!matches.length){box.innerHTML='<p class="muted">Chưa tìm thấy tệp khớp tên game trong kho GBA. Bạn có thể thử tên game ngắn hơn hoặc thêm mã thủ công.</p>';$('hint').textContent='Không tìm thấy mã phù hợp cho '+game;return}
  box.innerHTML='<h3>KẾT QUẢ KHO CHEAT ('+matches.length+')</h3>'+matches.map(x=>'<div class="gameRow"><span>'+escapeHtml(x.file.name)+'<br><small class="muted">'+(x.score===2?'Khớp tên':'Khớp gần đúng')+'</small></span><button onclick="downloadCheatFile(\\''+encodeURIComponent(x.file.download_url)+'\\',\\''+encodeURIComponent(x.file.name)+'\\')">TẢI MÃ</button></div>').join('');
  $('hint').textContent='Tìm thấy '+matches.length+' tệp mã. Chọn TẢI MÃ để nhập vào AutoCheat.';
 }catch(e){
  if(box)box.innerHTML='<p class="muted">Không kết nối được kho mã. Kiểm tra Internet rồi thử lại. ('+escapeHtml(e.message)+')</p>';
  $('hint').textContent='Tìm kho mã thất bại · cần kết nối Internet';
 }
}
function parseLibretroCheatFile(raw){
 const rows=new Map();
 String(raw||'').split(/\\r?\\n/).forEach(line=>{
  const m=line.match(/^\\s*cheat(\\d+)_(desc|code|enable)\\s*=\\s*(.*?)\\s*$/i);
  if(!m)return;
  const id=Number(m[1]),field=m[2].toLowerCase();
  let value=m[3].trim();
  if(value.startsWith('"')&&value.endsWith('"'))value=value.slice(1,-1).replace(/\\\\(["\\\\])/g,'$1');
  if(!rows.has(id))rows.set(id,{name:'',code:'',enabled:false});
  rows.get(id)[field==='desc'?'name':field==='code'?'code':'enabled']=field==='enable'?value.toLowerCase()==='true':value;
 });
 const result=[];
 [...rows.entries()].sort((a,b)=>a[0]-b[0]).forEach(([id,row])=>{
  const rawCode=String(row.code||'').trim();
  let chunks=rawCode.split(/\\s*\\+\\s*/).filter(Boolean);
  if(chunks.length===1)chunks=rawCode.trim().split(/\\s+/).filter(Boolean);
  let lines=[];
  if(chunks.length>=2&&chunks.length%2===0){
   for(let i=0;i<chunks.length;i+=2){
    if(/^[0-9a-f]{8}$/i.test(chunks[i])&&/^[0-9a-f]{4,8}$/i.test(chunks[i+1]))lines.push(chunks[i].toUpperCase()+' '+chunks[i+1].toUpperCase());
   }
  }
  const code=lines.join('\\n');
  if(code&&validCheatCode(code))result.push({name:String(row.name||('Cheat '+(id+1))).slice(0,100),code,enabled:false});
 });
 return result;
}
async function downloadCheatFile(encodedUrl,encodedName){
 const game=games[index]?.name||$('cheatGame')?.value||'';
 if(!game){$('hint').textContent='Chọn game trước khi tải mã';return}
 let url='',name='';
 try{url=decodeURIComponent(encodedUrl);name=decodeURIComponent(encodedName)}catch(e){$('hint').textContent='Đường dẫn tệp không hợp lệ';return}
 if(!url.startsWith('https://raw.githubusercontent.com/libretro/libretro-database/')){$('hint').textContent='Nguồn tải không được xác thực';return}
 $('hint').textContent='Đang tải mã: '+name;
 try{
  const response=await fetch(url);if(!response.ok)throw new Error('HTTP '+response.status);
  const text=await response.text(),downloaded=parseLibretroCheatFile(text);
  if(!downloaded.length)throw new Error('Tệp không có mã tương thích với mGBA');
  const previous=Array.isArray(cheats[game])?cheats[game].slice():[];
  const known=new Set(previous.map(x=>String(x.code||'').toLowerCase()));
  const fresh=downloaded.filter(x=>!known.has(x.code.toLowerCase()));
  if(!fresh.length){$('hint').textContent='Mã trong tệp này đã có trong kho AutoCheat.';return}
  cheats[game]=previous.concat(fresh);
  if(!saveLocal('cheats',cheats)){if(previous.length)cheats[game]=previous;else delete cheats[game];return}
  renderCheatList();
  $('hint').textContent='Đã tải '+fresh.length+' mã cho '+game+'. Mã mới đang TẮT; bật mã cần dùng rồi chọn LƯU CHEAT VÀ CHẠY mGBA.';
 }catch(e){$('hint').textContent='Không tải/đọc được tệp cheat: '+e.message}
}

function importBackupFile(file){
 if(!file)return;if(!confirm('Khôi phục sẽ thay thế thư viện game, AutoCheat và cài đặt hiện tại. Tiếp tục?')){$('backupImport').value='';return}const reader=new FileReader();
 reader.onload=()=>{
  try{
   const data=JSON.parse(String(reader.result||''));
   if(!data||data.app!=='TrauBiNon'||!Array.isArray(data.games)||!data.cheats||typeof data.cheats!=='object'||Array.isArray(data.cheats))throw new Error('Sai định dạng bản sao lưu');
   const seenUris=new Set();
   const nextGames=data.games.filter(g=>{
    if(!g||typeof g.name!=='string'||typeof g.uri!=='string')return false;
    const name=g.name.trim().slice(0,180),uri=g.uri.trim();
    if(!name||!uri||seenUris.has(uri))return false;
    seenUris.add(uri);return true;
   }).map(g=>({name:g.name.trim().slice(0,180),uri:g.uri.trim()}));
   const nextCheats={};Object.keys(data.cheats).forEach(k=>{
    const seenCodes=new Set(),rows=Array.isArray(data.cheats[k])?data.cheats[k]:[];
    nextCheats[String(k).slice(0,180)]=rows.map((x,i)=>normalizeCheatEntry(x,i)).filter(x=>{
     if(!x||!validCheatCode(x.code))return false;
     const code=x.code.toLowerCase();if(seenCodes.has(code))return false;seenCodes.add(code);return true;
    });
   });
   const nextGraphics=data.graphics&&typeof data.graphics==='object'?{quality:['Tiêu chuẩn','Lọc hình ảnh (mGBA)'].includes(String(data.graphics.quality))?String(data.graphics.quality):'Tiêu chuẩn',fps:['30 FPS','60 FPS'].includes(String(data.graphics.fps))?String(data.graphics.fps):'60 FPS'}:{quality:'Tiêu chuẩn',fps:'60 FPS'};
   const keys=['games','cheats','graphics'],values=[nextGames,nextCheats,nextGraphics],old=keys.map(k=>localStorage.getItem(k));
   try{keys.forEach((k,i)=>localStorage.setItem(k,JSON.stringify(values[i])))}catch(writeError){keys.forEach((k,i)=>{try{if(old[i]===null)localStorage.removeItem(k);else localStorage.setItem(k,old[i])}catch(ignore){}});throw new Error('Không đủ bộ nhớ để khôi phục; dữ liệu cũ được giữ nguyên.')}
   games=nextGames;cheats=nextCheats;index=0;renderGames();$('hint').textContent='Đã khôi phục '+games.length+' game và kho AutoCheat.';
  }catch(e){$('hint').textContent='Không thể khôi phục: '+e.message}
  $('backupImport').value='';
 };reader.onerror=()=>{$('hint').textContent='Không đọc được tệp sao lưu.'};reader.readAsText(file);
}
