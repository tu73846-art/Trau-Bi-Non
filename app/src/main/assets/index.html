<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#03090e"><title>Trâu Bi Non</title>
<style>
:root{--c:#19dcff;--bg:#03090e;--panel:#0a1821;--muted:#7896a5}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#d9f8ff;font-family:Arial,sans-serif}body{display:flex;flex-direction:column;padding:7px;gap:6px}button,input{font:inherit}button{background:#102631;color:#c9f8ff;border:1px solid #168eaa;border-radius:8px;padding:7px 10px;font-weight:700;min-height:32px}button:active,.active{background:#07506a;border-color:var(--c);box-shadow:0 0 9px #00d9ff88}header{height:38px;flex:none;border:1px solid var(--c);border-radius:10px;display:flex;align-items:center;justify-content:space-between;padding:4px 8px;color:var(--c);font-weight:bold;box-shadow:0 0 9px #00cfff33}header button{min-height:28px;padding:4px 10px}main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:8px}.tile{height:min(62%,28vw);aspect-ratio:1;border:1px solid #17677c;border-radius:12px;background:linear-gradient(145deg,#0d202b,#071018);display:flex;align-items:center;justify-content:center;text-align:center;color:#89aebb;padding:5px;overflow:hidden;word-break:break-word}.tile.big{height:min(88%,37vw);aspect-ratio:1.12;border:2px solid var(--c);color:#e2fbff;box-shadow:0 0 14px #00cfff44;font-weight:bold;font-size:clamp(12px,2.8vw,20px);flex:none}.tile small{display:block;color:var(--muted);font-size:10px;margin-top:5px}.actions{display:flex;justify-content:center;gap:6px;flex:none}.actions button{font-size:clamp(9px,2vw,13px)}footer{height:39px;flex:none;display:flex;align-items:center;justify-content:space-around;border:1px solid #165a70;border-radius:9px;padding:2px;gap:4px}footer button{flex:1;height:31px;padding:0;font-size:15px}footer button:nth-child(3){flex:1.5;color:#fff;border-color:#a5eaff}#hint{height:0.8cm;min-height:24px;max-height:28px;flex:none;text-align:center;color:#75b6c8;font-size:10px;display:flex;align-items:center;justify-content:center;border-top:1px solid #17485a}#menu{display:none;position:absolute;right:8px;top:48px;width:min(210px,58vw);padding:7px;background:#07131c;border:1px solid var(--c);border-radius:10px;z-index:5;box-shadow:0 0 15px #00cfff55}#menu button{display:block;width:100%;margin:4px 0;text-align:left}#panel{display:none;position:absolute;inset:8% 5%;background:#07131c;border:1px solid var(--c);border-radius:12px;padding:10px;overflow:auto;z-index:8;box-shadow:0 0 20px #00cfff55}#panel h3{margin:4px 0 10px;color:var(--c)}#panel input{width:100%;background:#02090e;color:white;border:1px solid #168eaa;border-radius:7px;padding:8px;margin:4px 0}#panel .close{float:right}#panel button{margin:3px}#gameList{max-height:32vh;overflow:auto}.gameRow{display:flex;gap:5px;align-items:center;padding:5px;border-bottom:1px solid #163b49}.gameRow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.muted{color:var(--muted);font-size:10px}.slotgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.slot{min-height:45px}#searchbar{display:none;position:absolute;left:8%;right:8%;top:48px;z-index:6;background:#07131c;border:1px solid var(--c);padding:8px;border-radius:10px}#searchbar input{width:100%;padding:9px;background:#02090e;color:white;border:1px solid var(--c);border-radius:8px}#notice{color:#9fd8e8;font-size:11px;margin:6px 0}.keys{display:flex;gap:5px;flex-wrap:wrap}.keys button{flex:1;min-width:35px}.red{border-color:#ff6682}.yellow{border-color:#f6d45c}.green{border-color:#63e6a3}.blue{border-color:#68aaff}
</style></head><body>
<header><span>🐃 TRÂU BI NON</span><span><button onclick="toggleSearch()">⌕ TÌM</button> <button onclick="toggleMenu()">⋮</button></span></header>
<div id="searchbar"><input id="searchInput" placeholder="Nhập tên game để tìm..." oninput="renderGames()"><button onclick="toggleSearch()">ĐÓNG</button></div>
<div id="menu"><button onclick="pickRom()">＋ Thêm game / ROM</button><button onclick="openPanel('library')">▤ Thư viện game</button><button onclick="openPanel('controls')">⌖ Cài nút điều khiển</button><button onclick="openPanel('graphics')">◈ Đồ họa & FPS</button><button onclick="openPanel('saves')">▣ Ô lưu game</button><button onclick="openPanel('cheats')">⚡ AutoCheat · Kho mã</button><button onclick="openMyBoy()">▶ Mở My Boy!</button></div>
<main><div class="tile" id="prev" onclick="shift(-1)">TRƯỚC</div><div class="tile big" id="current">CHƯA CÓ GAME<small>Thêm ROM để bắt đầu</small></div><div class="tile" id="next" onclick="shift(1)">TIẾP</div></main>
<div class="actions"><button onclick="pickRom()">＋ THÊM GAME</button><button onclick="launchCurrent()">▶ CHẠY GAME</button><button onclick="openMyBoy()">MY BOY!</button></div>
<footer><button class="blue" onclick="virtualKey('UP')">↑</button><button class="blue" onclick="virtualKey('LEFT')">←</button><button onclick="saveSlot()">SL · OK</button><button class="blue" onclick="virtualKey('RIGHT')">→</button><button class="blue" onclick="virtualKey('DOWN')">↓</button></footer>
<div id="hint">A · B · X · Y · SL · ST  |  Vuốt trái / phải để đổi game</div>
<div id="panel"><button class="close" onclick="closePanel()">ĐÓNG ✕</button><div id="panelBody"></div></div>
<script>
const $=id=>document.getElementById(id);let games=JSON.parse(localStorage.getItem('games')||'[]'),index=0,cheats=JSON.parse(localStorage.getItem('cheats')||'{}');
function persist(){localStorage.setItem('games',JSON.stringify(games))}
function toggleMenu(){ $('menu').style.display=$('menu').style.display==='block'?'none':'block'}
function toggleSearch(){ $('searchbar').style.display=$('searchbar').style.display==='block'?'none':'block';if($('searchbar').style.display==='block')$('searchInput').focus();else{$('searchInput').value='';renderGames()}}
function pickRom(){ $('menu').style.display='none';if(window.AndroidBridge)AndroidBridge.pickRom();else alert('Chọn ROM cần chạy trên bản Android.')}
function addGameFromAndroid(name,uri){let found=games.findIndex(g=>g.uri===uri);if(found<0){games.push({name:name,uri:uri});index=games.length-1}else index=found;persist();renderGames();$('hint').textContent='Đã thêm: '+name+' · Nhấn CHẠY GAME'}
function renderGames(){let q=$('searchInput')?.value?.toLowerCase()||'';let filtered=games.filter(g=>g.name.toLowerCase().includes(q));let g=games[index];$('current').innerHTML=g?escapeHtml(g.name)+'<small>'+ (index+1)+' / '+games.length+' GAME</small>':'CHƯA CÓ GAME<small>Thêm ROM để bắt đầu</small>';let p=games[(index-1+games.length)%games.length],n=games[(index+1)%games.length];$('prev').textContent=p?p.name:'TRƯỚC';$('next').textContent=n?n.name:'TIẾP';let list=$('gameList');if(list)list.innerHTML=filtered.map(x=>'<div class="gameRow"><span>'+escapeHtml(x.name)+'</span><button onclick="selectGameByUri(\''+encodeURIComponent(x.uri)+'\')">CHỌN</button></div>').join('')||'<p class="muted">Chưa có game phù hợp.</p>'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function selectGameByUri(u){let uri=decodeURIComponent(u);index=games.findIndex(g=>g.uri===uri);closePanel();renderGames()}
function shift(d){if(!games.length)return;index=(index+d+games.length)%games.length;renderGames()}
function launchCurrent(){let g=games[index];if(!g){pickRom();return}if(window.AndroidBridge)AndroidBridge.openRom(g.uri);else alert('Chỉ chạy ROM trong ứng dụng Android.')}
function openMyBoy(){ $('menu').style.display='none';if(window.AndroidBridge)AndroidBridge.openMyBoy();else alert('Chỉ có trên Android.')}
function openPanel(which){$('menu').style.display='none';let b=$('panelBody');$('panel').style.display='block';
if(which==='library'){b.innerHTML='<h3>THƯ VIỆN GAME</h3><button onclick="pickRom()">＋ THÊM ROM</button><div id="gameList"></div><p class="muted">Danh sách lưu trên thiết bị này.</p>'}
if(which==='controls'){b.innerHTML='<h3>CÀI NÚT ĐIỀU KHIỂN</h3><div class="keys"><button class="green">A</button><button class="red">B</button><button class="yellow">X</button><button class="blue">Y</button><button>SL</button><button>ST</button></div><p class="muted">Bố cục nút đang là giao diện điều khiển. Tín hiệu phím chưa được truyền vào lõi My Boy.</p>'}
if(which==='graphics'){b.innerHTML='<h3>ĐỒ HỌA & FPS</h3><label>Chế độ hiển thị</label><select id="quality"><option>Tiêu chuẩn</option><option>Phóng to màn hình</option><option>Lọc điểm ảnh (mô phỏng)</option></select><p><label>FPS mục tiêu</label><select id="fps"><option>30 FPS</option><option selected>60 FPS</option></select></p><p class="muted">Các lựa chọn này hiện chỉ lưu tùy chọn giao diện; không thay đổi bộ dựng hình của My Boy.</p><button onclick="savePrefs()">LƯU CÀI ĐẶT</button>'}
if(which==='saves'){b.innerHTML='<h3>Ô LƯU GAME</h3><div class="slotgrid">'+Array.from({length:8},(_,i)=>'<button class="slot" onclick="storeSlot('+i+')">Ô '+(i+1)+'<small id="slot'+i+'"></small></button>').join('')+'</div><p class="muted">Các ô này lưu thông tin game và thời điểm chọn, chưa phải save-state nội bộ của giả lập.</p>'}
if(which==='cheats'){b.innerHTML='<h3>⚡ AUTOCHEAT · KHO MÃ</h3><input id="cheatGame" placeholder="Tên game"><input id="cheatName" placeholder="Tên cheat"><input id="cheatCode" placeholder="Mã cheat"><button onclick="addCheat()">＋ LƯU CHEAT</button><button onclick="exportCheats()">XUẤT JSON</button><div id="cheatList"></div><p class="muted">Kho mã lưu cục bộ. Tự nhận dạng ROM và tự áp dụng cheat cần tích hợp lõi giả lập.</p>'}
renderGames();renderCheatList();updateSlots()}
function closePanel(){$('panel').style.display='none'}
function addCheat(){let g=$('cheatGame').value.trim()||'Game chưa đặt tên',n=$('cheatName').value.trim()||'Cheat',c=$('cheatCode').value.trim();if(!c)return;cheats[g]=cheats[g]||[];cheats[g].push({name:n,code:c});localStorage.setItem('cheats',JSON.stringify(cheats));$('cheatCode').value='';renderCheatList()}
function renderCheatList(){let e=$('cheatList');if(!e)return;e.innerHTML=Object.entries(cheats).map(([g,arr])=>'<p><b>'+escapeHtml(g)+'</b></p>'+arr.map(x=>'<div class="gameRow"><span>'+escapeHtml(x.name)+' · '+escapeHtml(x.code)+'</span></div>').join('')).join('')||'<p class="muted">Chưa có mã cheat.</p>'}
function exportCheats(){let blob=new Blob([JSON.stringify(cheats,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='trau-bi-non-cheats.json';a.click();URL.revokeObjectURL(a.href)}
function saveSlot(){storeSlot(0);$('hint').textContent='Đã lưu thông tin vào ô 1'}
function storeSlot(i){let data={game:games[index]?.name||'',time:new Date().toLocaleString()};localStorage.setItem('slot'+i,JSON.stringify(data));updateSlots()}
function updateSlots(){for(let i=0;i<8;i++){let e=$('slot'+i);if(e){let d=JSON.parse(localStorage.getItem('slot'+i)||'null');e.textContent=d?'\n'+d.game+' · '+d.time:'\nTrống'}}}
function savePrefs(){localStorage.setItem('graphics',JSON.stringify({quality:$('quality').value,fps:$('fps').value}));$('hint').textContent='Đã lưu tùy chọn giao diện'}
function virtualKey(k){$('hint').textContent='Nút '+k+' được nhấn · cần lõi giả lập để điều khiển game'}
let startX=0;document.addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX},{passive:true});document.addEventListener('touchend',e=>{let dx=e.changedTouches[0].screenX-startX;if(Math.abs(dx)>65)shift(dx<0?1:-1)},{passive:true});
renderGames();
</script></body></html>
