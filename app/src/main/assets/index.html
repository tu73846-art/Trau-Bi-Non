<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Trâu Bi Non</title><style>*{box-sizing:border-box}body{margin:0;background:#03090e;color:#d7f7ff;font-family:Arial;height:100vh;display:flex;flex-direction:column;padding:9px;gap:8px}header,section,footer{border:1px solid #20d9ff;border-radius:12px;box-shadow:0 0 10px #00cfff44;padding:10px}header{display:flex;justify-content:space-between;align-items:center;color:#20d9ff;font-weight:bold}button{background:#102631;color:#bff5ff;border:1px solid #20d9ff;border-radius:9px;padding:10px;font-weight:bold}main{flex:1;display:flex;align-items:center;justify-content:center;gap:8px}.tile{width:25vw;aspect-ratio:1;border:1px solid #1684a0;border-radius:14px;display:grid;place-items:center;background:#0b1720;color:#8aa5b5}.tile.big{width:34vw;border:2px solid #20d9ff;color:#20d9ff;font-weight:bold}footer{height:48px;display:flex;justify-content:space-around;align-items:center;font-size:12px}#menu{display:none;position:absolute;right:10px;top:55px;background:#07131c;padding:10px;border:1px solid #20d9ff;border-radius:10px;z-index:3}#menu button{display:block;width:100%;margin:4px 0}#cheats{display:none;position:absolute;inset:15% 5% 15%;background:#07131c;border:1px solid #20d9ff;border-radius:12px;padding:12px;overflow:auto;z-index:4}input{background:#02090e;color:white;border:1px solid #20d9ff;padding:8px;border-radius:8px;width:100%}</style></head><body><header><span>SANG TRÂU · TRÂU BI NON</span><span><button onclick="searchGames()">⌕</button> <button onclick="menu()">⋮</button></span></header><div id="menu"><button onclick="pickRom()">Thêm / chạy game</button><button onclick="openMyBoy()">Mở My Boy!</button><button onclick="cheats()">AutoCheat</button></div><main><div class="tile" onclick="shift(-1)">TRƯỚC</div><div class="tile big" id="current">CHƯA CÓ GAME</div><div class="tile" onclick="shift(1)">TIẾP</div></main><section style="text-align:center"><button onclick="pickRom()">CHỌN ROM VÀ CHẠY</button> <button onclick="openMyBoy()">MY BOY!</button></section><footer><button>↑</button><button>←</button><button>SL · OK</button><button>→</button><button>↓</button></footer><div id="cheats"><button onclick="cheats()">ĐÓNG</button><h3>AutoCheat · Kho mã</h3><input id="game" placeholder="Tên game"><input id="code" placeholder="Tên cheat | mã cheat"><button onclick="addCheat()">THÊM CHEAT</button><div id="list"></div><small>Cheat được lưu trong Trâu Bi Non; chưa tự tiêm vào bộ nhớ My Boy.</small></div><script>let n=0;function menu(){let e=document.getElementById('menu');e.style.display=e.style.display==='block'?'none':'block'}function pickRom(){menu();if(window.AndroidBridge)AndroidBridge.pickRom();else alert('Chỉ có trong bản Android')}function openMyBoy(){menu();if(window.AndroidBridge)AndroidBridge.openMyBoy()}function searchGames(){let q=prompt('Tìm game trong thư viện');if(q)document.getElementById('current').textContent=q}function shift(d){n+=d;document.getElementById('current').textContent='GAME '+(n+1)}function cheats(){let e=document.getElementById('cheats');e.style.display=e.style.display==='block'?'none':'block';menu()}function addCheat(){let g=document.getElementById('game').value||'Game';let c=document.getElementById('code').value;if(!c)return;let a=JSON.parse(localStorage.getItem('cheats')||'{}');(a[g]??=[]).push(c);localStorage.setItem('cheats',JSON.stringify(a));document.getElementById('list').innerHTML=Object.entries(a).map(([k,v])=>'<p>'+k+': '+v.join('<br>')+'</p>').join('');document.getElementById('code').value=''} </script></body></html>
