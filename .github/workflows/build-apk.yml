name: Build Trau Bi Non APK
# Rebuild after JavaScript smoke-test fix
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Get mGBA and SDL2 sources
        run: |
          git clone --depth 1 https://github.com/Gitsnup/mgba-android.git mgba-src
          git clone --depth 1 --branch release-2.30.9 https://github.com/libsdl-org/SDL.git SDL2
      - name: Install Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
      - name: Run app smoke tests
        run: python3 scripts/smoke_test.py
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Trau-Bi-Non-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
