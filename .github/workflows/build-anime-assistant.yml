name: Build Anime Assistant 2D APK
on:
  push:
    branches: [ anime-assistant-apk ]
    paths:
      - 'AnimeAssistant2D/**'
      - '.github/workflows/build-anime-assistant.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: AnimeAssistant2D
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AnimeAssistant2D-debug-apk
          path: AnimeAssistant2D/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
